<mat-tab-group #loginTabs="matTabGroup" [selectedIndex]="tabSelected">
  <mat-tab>
    <button mat-raised-button color='primary' (click)="auth.login('')" >
      Mandar código
    </button>
    <div id="sign-in-button"></div>
  </mat-tab>
  <mat-tab>
    <mat-card>
      <mat-card-content>
        <mat-form-field appearance="outline">
          <mat-label>Código de verificación</mat-label>
          <input
          matInput
          type="text"
          name="code"
          [formControl]="codeCtrl"
          >
          <mat-error *ngIf="codeCtrl.hasError('required')">
          Este dato es necesario
          </mat-error>
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions
      style="display: flex; justify-content:space-between;">
        <button mat-raised-button
        color="primary"
        (click)="onCode()"
        >Confirmar</button>
      </mat-card-actions>
    </mat-card>


  </mat-tab>
</mat-tab-group>
